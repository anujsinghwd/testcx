
repos:
  - repo: local
    hooks:

      # Remove trailing whitespace
      - id: trailing-whitespace
        name: Remove trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      # Ensure files end with a newline
      - id: end-of-file
        name: Check end of file
        entry: end-of-file-fixer
        language: system
        types: [text]

      # Ruff linting
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]

      # Ruff formatting
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]

      # MyPy type checking
      - id: mypy
        name: MyPy type checking
        entry: mypy app
        language: system
        pass_filenames: false
        always_run: true

      # Unit and integration tests
      - id: pytest
        name: Run automated tests
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Secret detection

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
