openapi: 3.0.3
info:
  title: Payment API Contract
  version: 1.0.0
  description: Payment Integration API contract. Details marked TBC where unconfirmed.

paths:
  /payments:
    post:
      summary: Initiate payment
      description: Submit payment instruction with idempotency support.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Unique idempotency key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payment request payload (TBC)
      responses:
        "200":
          description: Payment instruction accepted (TBC)
        "400":
          description: Invalid payment request
        "409":
          description: Duplicate payment request detected

  /payments/{id}/status:
    get:
      summary: Get payment status
      description: Retrieve current settlement status for a payment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment transaction identifier
      responses:
        "200":
          description: Payment status details (TBC)
        "404":
          description: Payment record not found

