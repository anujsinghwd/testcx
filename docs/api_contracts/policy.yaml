openapi: 3.0.3
info:
  title: Policy Search API Contract (Five Sigma v2)
  version: 2.0.0
  description: Policy Integration Service contract for Five Sigma FNOL policy search.

paths:
  /policies/search:
    get:
      summary: Search policies (Five Sigma v2)
      description: Search policies by Line of Business, organization external ID, and optional search fields.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: lob
          in: query
          required: true
          schema:
            type: string
          description: Line of business (exactly one)
        - name: org_external_id
          in: query
          required: true
          schema:
            type: string
          description: Organization external ID
        - name: suborg_external_id
          in: query
          required: false
          schema:
            type: string
          description: Sub-organization external ID
      responses:
        "200":
          description: Search results with display schema and opaque retrieval tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyApiSearchResponse"
        "401":
          description: Missing or invalid API key
        "422":
          description: Missing required search parameters
        "500":
          description: Internal or database failure

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    PolicyApiDisplaySchemaField:
      type: object
      required:
        - id
        - desc
        - type
      properties:
        id:
          type: string
        desc:
          type: string
        type:
          type: string
          enum: [string, date, select]

    PolicyApiSearchResult:
      type: object
      required:
        - display_fields
        - retrieval_token
      properties:
        display_fields:
          type: object
          additionalProperties: true
        retrieval_token:
          type: string

    PolicyApiSearchResponse:
      type: object
      required:
        - total_results
        - display_schema
        - results
      properties:
        total_results:
          type: integer
        display_schema:
          type: array
          items:
            $ref: "#/components/schemas/PolicyApiDisplaySchemaField"
        results:
          type: array
          items:
            $ref: "#/components/schemas/PolicyApiSearchResult"
